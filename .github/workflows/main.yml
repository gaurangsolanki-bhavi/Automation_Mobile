name: Android Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------ 📊 ALLURE REPORT SECTION ------------------
      - name: ⚙️ Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          components: |
            platform-tools
            emulator
            platforms;android-33
            system-images;android-33;google_apis;x86_64

      # ✅ CHANGE 1 — simplified and fixed emulator config
      - name: Launch Emulator & Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30                     # Stable on GitHub runners
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          avd-name: test
          disable-animations: true         # Runner disables animations
          emulator-boot-timeout: 800000
          emulator-options: -no-window -noaudio -gpu swiftshader_indirect
          script: |
            echo "⏳ Starting emulator..."
            adb wait-for-device
            boot_completed=""
            retries=0
            while [ -z "$boot_completed" ] && [ $retries -lt 60 ]; do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot_completed" = "1" ]; then
                echo "✅ Emulator boot completed!"
                break
              fi
              echo "⏳ Waiting for boot to complete... ($retries/60)"
              sleep 10
              retries=$((retries+1))
            done
            if [ "$boot_completed" != "1" ]; then
              echo "❌ Emulator failed to boot after waiting. Dumping logcat..."
              adb logcat -d | tail -n 50
              exit 1
            fi
            echo "📱 Running Android tests..."
            npm run test android profile || true

      - name: 🧩 Generate Allure Report
        run: |
          mkdir -p allure-results
          mkdir -p allure-report
          npx allure generate allure-results --clean -o allure-report || echo "⚠️ No allure-results found."

      - name: ⬆️ Upload Allure Report (as artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: 🚀 Deploy Allure Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: "allure-reports/${{ github.run_id }}" # <-- unique folder per run

      - name: 🖥️ Print Allure Report URL
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ Allure Report published successfully!"
          echo "🔗 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_id }}/"
